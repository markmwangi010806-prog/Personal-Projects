<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calorie Counter</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body
    class="bg-gray-100 min-h-screen text-gray-800 flex flex-col items-center p-4 sm:p-6"
  >
    <!-- Main Container -->
    <main class="w-full max-w-lg bg-white rounded-xl shadow-md p-6 space-y-6">
      <header class="text-center border-b pb-4">
        <h1 class="text-2xl font-bold text-emerald-600">
          Daily Calorie Counter
        </h1>
        <p class="text-sm text-gray-500">
          Track and manage your daily food intake
        </p>
      </header>

      <!-- Calorie Summary Display -->
      <section
        class="bg-emerald-50 rounded-lg p-4 text-center border border-emerald-200"
      >
        <h2
          class="text-sm font-semibold text-emerald-800 uppercase tracking-wider"
        >
          Total Calories Consumed
        </h2>
        <p
          id="total-calories"
          class="text-4xl font-extrabold text-emerald-600 my-1"
        >
          0
        </p>
        <p class="text-xs text-emerald-700">kcal</p>
      </section>

      <!-- Food Entry Form -->
      <form id="food-form" class="space-y-3">
        <div>
          <label for="food-name" class="block text-sm font-medium text-gray-700"
            >Food Item</label
          >
          <input
            type="text"
            id="food-name"
            placeholder="e.g., Apple, Grilled Chicken"
            required
            class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none"
          />
        </div>
        <div>
          <label
            for="food-calories"
            class="block text-sm font-medium text-gray-700"
            >Calories (kcal)</label
          >
          <input
            type="number"
            id="food-calories"
            placeholder="e.g., 95"
            min="1"
            required
            class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none"
          />
        </div>
        <div class="flex gap-2">
          <button
            type="submit"
            class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2 px-4 rounded-lg transition"
          >
            Add Item
          </button>
          <button
            type="button"
            id="fetch-sample-btn"
            class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-3 rounded-lg text-sm transition"
          >
            Simulate API Fetch
          </button>
        </div>
      </form>

      <!-- Food Item List -->
      <section class="space-y-3">
        <div class="flex justify-between items-center border-b pb-2">
          <h2 class="text-lg font-bold text-gray-700">Today's Food Log</h2>
          <button
            id="reset-btn"
            class="text-xs bg-red-100 hover:bg-red-200 text-red-700 font-semibold py-1 px-3 rounded-md transition"
          >
            Reset All
          </button>
        </div>
        <ul id="food-list" class="space-y-2 max-h-60 overflow-y-auto pr-1">
          <!-- Dynamically rendered list items will appear here -->
        </ul>
      </section>
    </main>

    <!-- External JavaScript Logic -->
    <script src="script.js"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calorie Counter</title>

    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-slate-100 min-h-screen text-slate-800">
    <div class="max-w-2xl mx-auto p-4 md:p-8">
      <header class="text-center mb-8">
        <h1 class="text-3xl md:text-4xl font-bold text-slate-900 mb-2">
          Calorie Counter
        </h1>
        <p class="text-slate-600">
          Track your daily food items and total calorie intake easily.
        </p>
      </header>

      <section class="bg-white p-6 rounded-xl shadow-md mb-6 text-center">
        <h2 class="text-lg font-semibold text-slate-600 mb-1">
          Total Calories Today
        </h2>
        <div
          id="totalCalories"
          class="text-5xl font-extrabold text-indigo-600 mb-4"
        >
          0
        </div>

        <div class="flex justify-center gap-3">
          <button
            id="resetBtn"
            class="bg-rose-500 hover:bg-rose-600 text-white font-medium py-2 px-4 rounded-lg transition"
          >
            Reset Day
          </button>
        </div>
      </section>

      <section class="bg-white p-6 rounded-xl shadow-md mb-6">
        <h2 class="text-xl font-bold text-slate-800 mb-4">Add Food Item</h2>
        <form id="foodForm" class="space-y-4">
          <div>
            <label
              for="foodName"
              class="block text-sm font-medium text-slate-700 mb-1"
              >Food Name</label
            >
            <div class="flex gap-2">
              <input
                type="text"
                id="foodName"
                placeholder="e.g., Apple, Chicken Breast"
                required
                class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
              />
              <button
                type="button"
                id="lookupBtn"
                class="bg-emerald-600 hover:bg-emerald-700 text-white text-sm px-3 rounded-lg transition whitespace-nowrap"
              >
                Autofill Calories
              </button>
            </div>
          </div>

          <div>
            <label
              for="calorieInput"
              class="block text-sm font-medium text-slate-700 mb-1"
              >Calories</label
            >
            <input
              type="number"
              id="calorieInput"
              min="0"
              placeholder="e.g., 95"
              required
              class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none"
            />
          </div>

          <button
            type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg transition"
          >
            Add Item
          </button>
        </form>

        <div
          id="statusMessage"
          class="mt-3 text-sm font-medium text-center hidden"
        ></div>
      </section>

      <section class="bg-white p-6 rounded-xl shadow-md">
        <h2 class="text-xl font-bold text-slate-800 mb-4">Today's Log</h2>
        <ul id="foodList" class="divide-y divide-slate-200"></ul>
        <p id="emptyMessage" class="text-slate-400 text-center py-4">
          No items added today yet.
        </p>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>

<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple calorie counter for tracking daily food intake."
    />
    <title>Calorie Counter</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body class="bg-slate-100 min-h-screen text-slate-800">
    <div class="max-w-2xl mx-auto p-4 md:p-8">
      <header class="text-center mb-8">
        <h1 class="text-3xl md:text-4xl font-bold text-slate-900 mb-2">
          Calorie Counter
        </h1>

        <p class="text-slate-600">
          Keep track of the food you eat and your daily calories.
        </p>
      </header>

      <section class="bg-white p-6 rounded-xl shadow-md mb-6 text-center">
        <h2 class="text-lg font-semibold text-slate-600 mb-2">
          Total Calories Today
        </h2>

        <p id="totalCalories" class="text-5xl font-bold text-indigo-600 mb-4">
          0
        </p>

        <button
          id="resetBtn"
          type="button"
          class="bg-rose-500 hover:bg-rose-600 text-white font-medium py-2 px-4 rounded-lg"
        >
          Reset Day
        </button>
      </section>

      <section class="bg-white p-6 rounded-xl shadow-md mb-6">
        <h2 class="text-xl font-bold mb-4">Add Food Item</h2>

        <form id="foodForm" class="space-y-4">
          <div>
            <label for="foodName" class="block text-sm font-medium mb-1">
              Food Name
            </label>

            <div class="flex flex-col sm:flex-row gap-2">
              <input
                type="text"
                id="foodName"
                placeholder="e.g. Apple"
                required
                class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
              />

              <button
                type="button"
                id="lookupBtn"
                class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg"
              >
                Autofill Calories
              </button>
            </div>
          </div>

          <div>
            <label for="calorieInput" class="block text-sm font-medium mb-1">
              Calories
            </label>

            <input
              type="number"
              id="calorieInput"
              min="0"
              placeholder="e.g. 95"
              required
              class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
            />
          </div>

          <button
            type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 rounded-lg"
          >
            Add Item
          </button>
        </form>

        <p id="statusMessage" class="hidden mt-3 text-sm text-center"></p>
      </section>

      <section class="bg-white p-6 rounded-xl shadow-md">
        <h2 class="text-xl font-bold mb-4">Today's Log</h2>

        <ul id="foodList" class="divide-y divide-slate-200"></ul>

        <p id="emptyMessage" class="text-slate-400 text-center py-4">
          No items added today yet.
        </p>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>

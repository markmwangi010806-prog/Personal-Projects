  <body class="min-h-screen bg-slate-100 text-slate-800">
    <main class="mx-auto max-w-2xl p-4 md:p-8">

```
  <!-- Page Header -->
  <header class="mb-8 text-center">
    <h1 class="mb-2 text-3xl font-bold text-slate-900 md:text-4xl">
      Calorie Counter
    </h1>

    <p class="text-slate-600">
      Track your daily food items and total calorie intake easily.
    </p>
  </header>

  <!-- Total Calories Section -->
  <section
    class="mb-6 rounded-xl bg-white p-6 text-center shadow-md"
    aria-labelledby="total-heading"
  >
    <h2
      id="total-heading"
      class="mb-1 text-lg font-semibold text-slate-600"
    >
      Total Calories Today
    </h2>

    <div
      id="totalCalories"
      class="mb-4 text-5xl font-extrabold text-indigo-600"
    >
      0
    </div>

    <button
      id="resetBtn"
      type="button"
      class="rounded-lg bg-rose-500 px-4 py-2 font-medium text-white transition hover:bg-rose-600"
    >
      Reset Day
    </button>
  </section>

  <!-- Add Food Section -->
  <section
    class="mb-6 rounded-xl bg-white p-6 shadow-md"
    aria-labelledby="add-food-heading"
  >
    <h2
      id="add-food-heading"
      class="mb-4 text-xl font-bold text-slate-800"
    >
      Add Food Item
    </h2>

    <form id="foodForm" class="space-y-4">

      <!-- Food Name -->
      <div>
        <label
          for="foodName"
          class="mb-1 block text-sm font-medium text-slate-700"
        >
          Food Name
        </label>

        <div class="flex flex-col gap-2 sm:flex-row">
          <input
            type="text"
            id="foodName"
            name="foodName"
            placeholder="e.g. Apple, Chicken Breast"
            required
            class="w-full rounded-lg border border-slate-300 px-4 py-2 outline-none focus:ring-2 focus:ring-indigo-500"
          />

          <button
            type="button"
            id="lookupBtn"
            class="rounded-lg bg-emerald-600 px-3 py-2 text-sm text-white transition hover:bg-emerald-700 sm:whitespace-nowrap"
          >
            Autofill Calories
          </button>
        </div>
      </div>

      <!-- Calories -->
      <div>
        <label
          for="calorieInput"
          class="mb-1 block text-sm font-medium text-slate-700"
        >
          Calories
        </label>

        <input
          type="number"
          id="calorieInput"
          name="calories"
          min="0"
          step="1"
          placeholder="e.g. 95"
          required
          class="w-full rounded-lg border border-slate-300 px-4 py-2 outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="w-full rounded-lg bg-indigo-600 py-2 font-semibold text-white transition hover:bg-indigo-700"
      >
        Add Item
      </button>
    </form>

    <!-- Status Message -->
    <div
      id="statusMessage"
      class="mt-3 hidden text-center text-sm font-medium"
      role="status"
      aria-live="polite"
    ></div>
  </section>

  <!-- Food List Section -->
  <section
    class="rounded-xl bg-white p-6 shadow-md"
    aria-labelledby="log-heading"
  >
    <h2
      id="log-heading"
      class="mb-4 text-xl font-bold text-slate-800"
    >
      Today's Log
    </h2>

    <ul
      id="foodList"
      class="divide-y divide-slate-200"
      aria-live="polite"
    ></ul>

    <p
      id="emptyMessage"
      class="py-4 text-center text-slate-400"
    >
      No items added today yet.
    </p>
  </section>

</main>

<!-- JavaScript -->
<script src="script.js"></script>
```

  </body>
</html>
